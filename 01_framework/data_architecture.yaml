# DATA ARCHITECTURE — BANGLADESHI APPLICANT INTELLIGENCE SYSTEM
# Version 3.0
# 
# DESIGN PRINCIPLES:
# 1. JSON files on disk — no database setup required to start, trivial to migrate later
# 2. Every field is nullable — gaps are data, not errors  
# 3. Sources array on every school — every number traces to a URL
# 4. Patterns are first-class data — staging.json → confirmed.json
# 5. Schema is additive — new sections (essays, visa) append without breaking existing data
# 6. Computed fields are labeled — system knows what it calculated vs what it found
#
# FILE STRUCTURE:
# data/
#   schools/
#     {school_id}.json         ← one file per school, complete profile
#   patterns/
#     staging.json             ← unconfirmed observations (all schools)
#     confirmed.json           ← promoted, evidence-backed patterns
#   essays/
#     frameworks.json          ← essay frameworks by school + archetype
#   visa/
#     flags.json               ← long-term visa flags by school/state
#   index.json                 ← lightweight school index for frontend queries
#
# ============================================================
# SCHOOL SCHEMA v3.0
# File: data/schools/{school_id}.json
# ============================================================

{
  # ---- META ------------------------------------------------
  "schema_version": "3.0",
  "school_id": "string",              # lowercase_underscored e.g. "williams_college"
  "display_name": "string",           # "Williams College"
  "research_date": "YYYY-MM-DD",
  "researched_by": "gemini-2.5-pro",  # model that produced this
  "staleness_review_due": "YYYY-MM-DD",  # research_date + 12 months
  "profile_completeness": "full|partial|stub",  # full = all layers attempted
  "raw_notes": "string",              # freeform — anything that doesn't fit the schema

  # ---- LAYER 0: POLICY TYPE (R2) ---------------------------
  "policy": {
    "type": "A|B|C|D|E|unknown",
    "type_reasoning": "string",       # explain WHY this type, not just what
    "verified_on": "YYYY-MM-DD",
    "source_url": "string",
    "applies_to_intl_specifically": true,  # confirmed on intl-specific page?
    "confirmation_page": "string",    # exact URL of intl aid page
    "need_blind_for_intl": null,
    "meets_full_need": null,
    "loans_in_package": null,
    "policy_change_risk": "low|medium|high",
    "policy_change_risk_reason": "string",
    "recent_policy_changes": "string", # any change in last 3 years
    "known_traps": "string"           # e.g. Columbia "admitted with funding" language
  },

  # ---- LAYER 1: CDS H6 FORENSICS (R3) ---------------------
  "cds": {
    "academic_year": "string",        # "2024-2025"
    "source_url": "string",
    "source_method": "pdf_direct|html|aggregator|ipeds",
    "source_tier": "T1|T2|T3|STALE_ESTIMATE",

    "h6_recipients": null,            # number of intl students who received aid
    "h6_avg_award": null,             # average dollar award (may include loans)
    "h6_total_budget": null,          # total dollars awarded to intl students
    "total_intl_enrollment": null,    # from CDS Section B

    "computed": {
      "coverage_rate": null,          # h6_recipients / total_intl_enrollment
      "implied_gap": null,            # COA_total - h6_avg_award
      "pct_coa_covered": null,        # h6_avg_award / COA_total
      "budget_per_intl_student": null # h6_total_budget / total_intl_enrollment
    },

    "loans_in_package": null,
    "avg_loan_component": null,       # if loans known, what is avg loan amount?
    "true_package": null,             # h6_avg_award - avg_loan_component
    "work_study_in_package": null,
    "merit_classified_as_need": null, # flag: inflates H6 figure at merit-heavy schools

    "claimed_avg_on_website": null,   # what the aid page says avg is
    "discrepancy_note": "string",     # explain H6 vs claimed discrepancy if any

    "prior_year_h6_avg": null,        # for trend detection
    "prior_year_recipients": null,
    "trend_note": "string"
  },

  # ---- LAYER 2: COST OF ATTENDANCE -------------------------
  "coa": {
    "year": "string",
    "tuition": null,
    "room_board": null,
    "fees": null,
    "books_supplies": null,
    "personal": null,
    "total": null,
    "source_url": "string"
  },

  # ---- LAYER 3: NATIONALITY PROXY (R4) ---------------------
  "nationality_aid_profile": {
    "western_english_signal": "strong|moderate|weak|absent",
    "east_southeast_asian_signal": "strong|moderate|weak|absent",
    "south_asian_signal": "strong|moderate|weak|absent",
    "south_asian_signal_evidence": "string",

    "documentation_friendliness": "high|medium|low",
    "documentation_notes": "string",  # e.g. dedicated intl aid counselor? CSS guidance?
    "efc_inflation_risk": "low|medium|high|unknown",
    "efc_notes": "string",

    "intl_aid_counselor_exists": null,
    "south_asia_officer_exists": null,

    "bangladeshi_specific": {
      "estimated_annual_admits": null,
      "estimated_funded_admits": null,
      "estimated_aid_rate_pct": null,
      "estimated_avg_package_range": [null, null],
