# ============================================================
# MIGRATION PATH (for when JSON files outgrow the folder)
# ============================================================
#
# The flat JSON structure is designed to migrate cleanly.
#
# To Firestore:
#   - Each school JSON → one Firestore document in collection "schools"
#   - patterns/staging.json → "patterns_staging" collection
#   - patterns/confirmed.json → "patterns_confirmed" collection  
#   - index.json → "school_index" single document
#
# To SQLite (for structured EU queries):
#   CREATE TABLE schools (
#     school_id TEXT PRIMARY KEY,
#     display_name TEXT,
#     policy_type TEXT,
#     coverage_rate REAL,
#     avg_true_package REAL,
#     coa_total REAL,
#     eu_1350 REAL, eu_1430 REAL, eu_1480 REAL, eu_1550 REAL,
#     curriculum_gate TEXT,
#     research_date TEXT
#   );
#   -- Populated by: python scripts/json_to_sqlite.py data/schools/ schools.db
#
# To vector store (for semantic search over honest_summary + bd profiles):
#   - Embed: honest_summary + raw_notes + essay_advisory_seeds
#   - Any embedding provider works — the JSON structure doesn't change
#
# The rule: the JSON files are always the source of truth.
# The database is always derived from the JSON files.
# Never write to the database directly; always write to JSON and regenerate.
